- triggers: !input override_triggers
- alias: ButtonPress
  id: ButtonPress
  platform: event
  event_type: zwave_js_value_notification
  event_data:
    device_id: !input zooz_switch
- alias: HassStart
  id: HassStart
  platform: homeassistant
  event: start
- platform: state
  entity_id: !input input_entity0
  enabled: '{{ inputs[0].trigger_entity not in [none, '''', []] }}'
  id: StateTrigger
  alias: '0'
- platform: state
  entity_id: !input input_entity1
  enabled: '{{ inputs[1].trigger_entity not in [none, '''', []] }}'
  id: StateTrigger
