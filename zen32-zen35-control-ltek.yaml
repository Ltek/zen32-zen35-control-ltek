  - conditions: "{{\n  trigger.id == 'StateTrigger' and\n  inputs[trigger.alias |
      int].led_mode != 'firmware' and\n  (trigger.from_state is none or\n   trigger.to_state.state
      != trigger.from_state.state)\n}}\n"
    alias: SingleButtonStateUpdate
    sequence:
    - variables:
        current: '{{ inputs[trigger.alias | int] }}'
        target_state: '{{ trigger.to_state.state }}'
    - variables: &id001
        map_b_off: |-
          {%- set new = is_new_firmware in [true, 'True', 'true'] -%}
          {%- set vraw = current.off_brightness | string | trim | lower -%}
          {%- set v = (g_off_brightness | string | trim | lower) if vraw == 'global' else vraw -%}
          {%- set names = {'low': 3, 'medium': 6, 'bright': 10} -%}
          {%- if v == '99' -%}99
          {%- else -%}
          {%- if v in names -%}{%- set lvl = names[v] -%}
          {%- elif v | regex_match('^[0-9]+$') and 1 <= v | int <= 10 -%}{%- set lvl = v | int -%}
          {%- else -%}{%- set lvl = 6 -%}
          {%- endif -%}
          {%- if new -%}{{ lvl }}{%- else -%}{{ 2 if lvl <= 3 else (1 if lvl <= 7 else 0) }}{%- endif -%}
          {%- endif -%}
        map_b_on: |-
          {%- set new = is_new_firmware in [true, 'True', 'true'] -%}
          {%- set vraw = current.on_brightness | string | trim | lower -%}
          {%- set v = (g_on_brightness | string | trim | lower) if vraw == 'global' else vraw -%}
          {%- set names = {'low': 3, 'medium': 6, 'bright': 10} -%}
          {%- if v == '99' -%}99
          {%- else -%}
          {%- if v in names -%}{%- set lvl = names[v] -%}
          {%- elif v | regex_match('^[0-9]+$') and 1 <= v | int <= 10 -%}{%- set lvl = v | int -%}
          {%- else -%}{%- set lvl = 6 -%}
          {%- endif -%}
          {%- if new -%}{{ lvl }}{%- else -%}{{ 2 if lvl <= 3 else (1 if lvl <= 7 else 0) }}{%- endif -%}
          {%- endif -%}
        map_b_unavail: |-
          {%- set new = is_new_firmware in [true, 'True', 'true'] -%}
          {%- set vraw = current.unavail_brightness | string | trim | lower -%}
          {%- set v = (g_unavail_brightness | string | trim | lower) if vraw == 'global' else vraw -%}
          {%- set names = {'low': 3, 'medium': 6, 'bright': 10} -%}
          {%- if v == '99' -%}99
          {%- else -%}
          {%- if v in names -%}{%- set lvl = names[v] -%}
          {%- elif v | regex_match('^[0-9]+$') and 1 <= v | int <= 10 -%}{%- set lvl = v | int -%}
          {%- else -%}{%- set lvl = 6 -%}
          {%- endif -%}
          {%- if new -%}{{ lvl }}{%- else -%}{{ 2 if lvl <= 3 else (1 if lvl <= 7 else 0) }}{%- endif -%}
          {%- endif -%}
        map_b_ovr: |-
          {%- set new = is_new_firmware in [true, 'True', 'true'] -%}
          {%- set vraw = current.ovr_brightness | string | trim | lower -%}
          {%- set v = (g_ovr_brightness | string | trim | lower) if vraw == 'global' else vraw -%}
          {%- set names = {'low': 3, 'medium': 6, 'bright': 10} -%}
          {%- if v == '99' -%}99
          {%- else -%}
          {%- if v in names -%}{%- set lvl = names[v] -%}
          {%- elif v | regex_match('^[0-9]+$') and 1 <= v | int <= 10 -%}{%- set lvl = v | int -%}
          {%- else -%}{%- set lvl = 6 -%}
          {%- endif -%}
          {%- if new -%}{{ lvl }}{%- else -%}{{ 2 if lvl <= 3 else (1 if lvl <= 7 else 0) }}{%- endif -%}
          {%- endif -%}
        condition: >-
          {% if target_state in off_states %}
            {{ dict(state=(g_off_state if current.off_state == 'global' else current.off_state), color=(g_off_color if current.off_color == 'global' else current.off_color), brightness=map_b_off) }}
          {% elif target_state in on_states %}
            {{ dict(state=(g_on_state if current.on_state == 'global' else current.on_state), color=(g_on_color if current.on_color == 'global' else current.on_color), brightness=map_b_on) }}
          {% elif target_state == "unavailable" %}
            {{ dict(state=(g_unavail_state if current.unavail_state == 'global' else current.unavail_state), color=(g_unavail_color if current.unavail_color == 'global' else current.unavail_color), brightness=map_b_unavail) }}
          {% else %}
            {{ dict(state=None, color=None, brightness=None) }}
          {% endif %}
        ovr_state: >-
          {%- set v = g_ovr_state if current.ovr_state == 'global' else current.ovr_state -%}
          {{ condition.state if v == '99' else v }}
        ovr_color: >-
          {%- set v = g_ovr_color if current.ovr_color == 'global' else current.ovr_color -%}
          {{ condition.color if v == '99' else v }}
        ovr_brightness: '{{ condition.brightness if map_b_ovr | string | trim == ''99''
          else map_b_ovr }}'
        parameter:
          toggle: '{{ current.button_id | int + toggle_offset | int }}'
          color: '{{ current.button_id | int + color_offset | int }}'
          brightness: '{{ current.button_id | int + brightness_offset | int }}'
    - if:
      - condition: template
        value_template: '{{ condition.state is not none }}'
      then:
        sequence: &id002
        - choose:
          - alias: OverrideActive
            conditions: !input override_condition
            sequence:
            - service: zwave_js.set_config_parameter
              data:
                parameter: '{{ parameter.toggle }}'
                value: '{{ ''3'' if ovr_state == ''99'' else ovr_state }}'
              target:
                device_id: '{{ controller_id }}'
            - delay:
                milliseconds: 100
            - service: zwave_js.set_config_parameter
              data:
                parameter: '{{ parameter.color }}'
                value: '{{ ovr_color }}'
              target:
                device_id: '{{ controller_id }}'
            - delay:
                milliseconds: 100
            - service: zwave_js.set_config_parameter
              data:
                parameter: '{{ parameter.brightness }}'
                value: '{{ ovr_brightness }}'
              target:
                device_id: '{{ controller_id }}'
          default:
          - service: zwave_js.set_config_parameter
            data:
              parameter: '{{ parameter.toggle }}'
              value: '{{ ''3'' if condition.state == ''99'' else condition.state }}'
            target:
              device_id: '{{ controller_id }}'
          - delay:
              milliseconds: 100
          - service: zwave_js.set_config_parameter
            data:
              parameter: '{{ parameter.color }}'
              value: '{{ condition.color }}'
            target:
              device_id: '{{ controller_id }}'
          - delay:
              milliseconds: 100
          - service: zwave_js.set_config_parameter
            data:
              parameter: '{{ parameter.brightness }}'
              value: '{{ condition.brightness }}'
            target:
              device_id: '{{ controller_id }}'
  - conditions: "{{\n  trigger.id not in ['ButtonPress', 'StateTrigger', 'AutomationUpdate']\n}}\n"
    alias: UniversalRefreshAction
    sequence:
    - if:
      - condition: template
        value_template: '{{ trigger.id == ''HassStart'' }}'
      then:
      - delay: 00:01:00
    - if:
      - condition: template
        value_template: '{{ turn_off_untracked and untracked_buttons | length > 0
          }}'
      then: &id003
      - repeat:
          for_each: '{{ untracked_buttons }}'
          sequence:
          - service: zwave_js.set_config_parameter
            data:
              parameter: '{{ repeat.item.button_id | int + toggle_offset | int }}'
              value: '2'
            target:
              device_id: '{{ controller_id }}'
    - repeat: &id004
        for_each: '{{ valid_buttons }}'
        sequence:
        - variables:
            current: '{{ repeat.item }}'
            target_state: '{{ states(repeat.item.trigger_entity) }}'
        - variables: *id001
        - if:
          - condition: template
            value_template: '{{ condition.state is not none }}'
          then:
            sequence: *id002
        - delay:
            milliseconds: 100
  - conditions: '{{ trigger.id == ''AutomationUpdate'' }}'
    alias: AutomationUpdateAction
    sequence:
    - service: zwave_js.set_config_parameter
      data:
        parameter: '1'
        value: '{{ inputs[0].track_relay if inputs[0].led_mode == ''firmware''
          else ''2'' }}'
      target:
        device_id: '{{ controller_id }}'
    - service: zwave_js.set_config_parameter
      data:
        parameter: '19'
        value: '{{ input_p19 }}'
      target:
        device_id: '{{ controller_id }}'
    - service: zwave_js.set_config_parameter
      data:
        parameter: '20'
        value: '{{ input_p20 }}'
      target:
        device_id: '{{ controller_id }}'
    - if:
      - condition: template
        value_template: '{{ turn_off_untracked and untracked_buttons | length > 0
          }}'
      then: *id003
    - repeat: *id004