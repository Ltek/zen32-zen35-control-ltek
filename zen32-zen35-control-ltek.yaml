blueprint:
  name: 🎛️ ZEN32 / ZEN35 Scene & LED Control by LTek
  description: |
    **Run scenes from every button while each LED mirrors any entity's state — color, behavior, and brightness — over Z-Wave JS**

    🚀 Version 2026.10.03.2

    ---
    ## 🎬 Button Actions
    - Pressed once, held, released, and 2x–5x multi-tap — each with its own action
    - Big button (relay / dimmer) plus the four scene buttons
    - 3-way switch scene (momentary; 800-series, or 700-series firmware 10.40+)

    ## 💡 Per-Button LED Tracking
    - Point a button at any entity (light, cover, lock, climate, sensor, …)
    - Its LED color, behavior, and brightness follow that entity's on / off / unavailable state
    - Big button's LED is blueprint-driven by default, or hand it to the device firmware

    ## 🌍 Global Defaults
    - Set color, behavior, and brightness for on / off / unavailable once, for all buttons
    - Any button can override a value; otherwise it inherits the default

    ## 🌗 Conditional Override
    - Supply your own **triggers** (when to re-check) and **condition** (when it's active)
    - Any time, entity, sun, numeric, or template logic Home Assistant supports
    - Override behavior / color / brightness **per button** — e.g. dim every LED after sunset while each keeps its color
    - Replaces the old fixed Night Time feature

    ## 🔆 Brightness Scale
    - Chosen on the device's own 1–10 scale (3 = Low, 6 = Medium, 10 = Bright)
    - New-scale firmware (ZEN35 1.40+, ZEN32 800LR 3.30+) is auto-detected
    - Older firmware is remapped automatically (1–3 Low, 4–7 Medium, 8–10 Bright); detection can be overridden

    ## ⚙️ Relay / Dimmer Options
    - Smart-bulb mode and load/LED reporting (parameters 19 & 20)
    - Optionally force untracked buttons' LEDs to Always Off

    ---
    > Requires Home Assistant **2024.10.0+**. Configure any other Z-Wave parameters on the device page.
    > Based on the blueprint by rwalker777.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    zooz_switch:
      name: Zooz Scene Controller
      description: List of available Zooz ZEN32 or ZEN35 switches.
      selector:
        device:
          filter:
          - integration: zwave_js
            manufacturer: Zooz
            model: ZEN32
          - integration: zwave_js
            manufacturer: Zooz
            model: ZEN32 800LR
          - integration: zwave_js
            manufacturer: Zooz
            model: ZEN35
          multiple: false
    firmware_version:
      name: Firmware Version
      description: 'Select your device''s firmware version to use correct LED
        brightness scale. **ZEN32 800LR 3.30+ and ZEN35 1.40+** use 1-10 brightness
        scale (Recommended). **Older ZEN32** models use 0-2 brightness scale.
        This setting is auto-detected from your device model and firmware version but can be manually overridden.

        '
      default: auto
      selector:
        select:
          mode: dropdown
          options:
          - label: Auto-detect from device model and firmware (Recommended)
            value: auto
          - label: ZEN32 800LR 3.30+ / ZEN35 1.40+ (1-10 scale)
            value: new
          - label: ZEN32 older versions (0-2 scale)
            value: legacy
          multiple: false
          custom_value: false
          sort: false
    p19_relay_control:
      name: Enable / Disable Relay / Dimmer Control (Parameter 19)
      description: Disable for smart bulb mode, or if there is no load attached
        to the relay (ZEN32) / dimmer (ZEN35), or you want the big button to be
        scene only.
      default: '1'
      selector:
        select:
          mode: dropdown
          options:
          - label: Local control disabled (Smart bulb mode)
            value: '0'
          - label: Local and Z-Wave control enabled
            value: '1'
          - label: Local and Z-Wave control disabled
            value: '2'
          multiple: false
          custom_value: false
          sort: false
    p20_relay_led_report:
      name: Enable / Disable Reporting and LED toggle if Relay / Dimmer is Disabled (Parameter 20)
      description: It *should* be disabled
      default: '1'
      selector:
        select:
          mode: dropdown
          options:
          - label: Enable
            value: '0'
          - label: Disable
            value: '1'
          multiple: false
          custom_value: false
          sort: false
    turn_off_untracked:
      name: Turn Off Untracked LEDs
      description: If enabled, any scene buttons that do not have a tracked entity
        will have their LEDs permanently turned off (Always Off).
      default: false
      selector:
        boolean: {}
    global_defaults:
      icon: mdi:earth
      name: Global Defaults
      description: 'Defaults auto-apply to all related buttons. Individual button overrides are set inside the separate button panel sections.'
      collapsed: true
      input:
        global_on_state:
          name: On Behavior
          description: Led state when a tracked target is on, opened, armed or unlocked.
          default: '3'
          selector:
            select:
              mode: dropdown
              options:
              - label: Always off
                value: '2'
              - label: Always on
                value: '3'
              multiple: false
              custom_value: false
              sort: false
        global_on_color:
          name: On Color
          description: Color for LED when a tracked target is on.
          default: '2'
          selector:
            select:
              mode: dropdown
              options:
              - label: White
                value: '0'
              - label: Blue
                value: '1'
              - label: Green
                value: '2'
              - label: Red
                value: '3'
              - label: Magenta
                value: '4'
              - label: Yellow
                value: '5'
              - label: Cyan
                value: '6'
              multiple: false
              custom_value: false
              sort: false
        global_on_brightness:
          name: On Brightness
          description: LED brightness when a tracked target is on. 3 = Low, 6 = Medium, 10 = Bright. Older firmware is remapped automatically. Not used when On Behavior is set to Always Off.
