variables:
  g_ovr_state: !input global_ovr_state
  g_ovr_color: !input global_ovr_color
  g_ovr_brightness: !input global_ovr_brightness
  g_on_state: !input global_on_state
  g_on_color: !input global_on_color
  g_on_brightness: !input global_on_brightness
  g_off_state: !input global_off_state
  g_off_color: !input global_off_color
  g_off_brightness: !input global_off_brightness
  g_unavail_state: !input global_unavail_state
  g_unavail_color: !input global_unavail_color
  g_unavail_brightness: !input global_unavail_brightness
  controller_id: !input zooz_switch
  input_p19: !input p19_relay_control
  input_p20: !input p20_relay_led_report
  firmware_override: !input firmware_version
  device_model: '{{ device_attr(controller_id, ''model'') }}'
  is_new_firmware: |-
    {%- if firmware_override == 'auto' -%}
    {%- set ver = device_attr(controller_id, 'sw_version') | string | trim -%}
    {%- if ver in ['', 'None', 'none', 'unknown', 'unavailable'] -%}{{ device_model in ['ZEN32 800LR', 'ZEN35'] }}
    {%- else -%}
    {%- set p = ver.split('.') -%}
    {%- set key = (p[0] | int(0)) * 1000000 + ((p[1] | int(0)) if p | length > 1 else 0) * 1000 + ((p[2] | int(0)) if p | length > 2 else 0) -%}
    {{ (device_model == 'ZEN35' and key >= 1040000) or (device_model == 'ZEN32 800LR' and key >= 3030000) }}
    {%- endif -%}
    {%- else -%}{{ firmware_override == 'new' }}
    {%- endif -%}
  toggle_offset: 1
  color_offset: 6
  brightness_offset: 11
  on_states:
  - 'on'
  - open
  - opening
  - 'true'
  - 'True'
  - true
  - true
  - playing
  - heat
  - cool
  - dry
  - armed_home
  - armed_away
  - armed_vacation
  - armed_night
  - armed_custom_bypass
  - triggered
  - pending
  - arming
  - unlocked
  - 1
  - home
  - active
  off_states:
  - 'off'
  - closed
  - closing
  - 'false'
  - 'False'
  - false
  - false
  - standby
  - paused
  - idle
  - disarmed
  - disarming
  - locked
  - not_home
  - away
  valid_buttons: '{{ inputs | rejectattr(''trigger_entity'', ''in'', [none, '''',
    []]) | rejectattr(''led_mode'', ''eq'', ''firmware'') | list }}'
  turn_off_untracked: !input turn_off_untracked
  untracked_buttons: '{{ inputs | selectattr(''trigger_entity'', ''in'', [none, '''',
    []]) | rejectattr(''led_mode'', ''eq'', ''firmware'') | list }}'
